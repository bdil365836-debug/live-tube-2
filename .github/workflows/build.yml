
name: Build LiveTube APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            ls -la
            exit 1
          fi
          echo "Using $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d /tmp/livetube
          cp -a /tmp/livetube/LiveTube-main/. .

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LiveTube-APK
          path: app/build/outputs/apk/debug/app-debug.apk
